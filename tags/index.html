---
layout: default
title: タグ一覧
---
<section class="pt-32 pb-20 px-6">
  <div class="max-w-screen-md mx-auto">
    <h1 class="text-3xl font-bold text-center mb-12">タグ一覧</h1>
    {% assign tags = site.tags | sort %}
    {% for tag in tags %}
    <div id="{{ tag[0] }}" class="mb-10">
      <h2 class="text-xl font-semibold text-sky-400 mb-4">{{ tag[0] }}</h2>
      <div class="space-y-3">
        {% for post in tag[1] %}
        <a href="{{ post.url | prepend: site.baseurl }}" class="group flex items-baseline gap-4 py-2 hover:text-sky-400 transition-colors">
          <time class="text-xs text-gray-500 whitespace-nowrap">{{ post.date | date: "%Y.%m.%d" }}</time>
          <span class="text-gray-900 dark:text-gray-100 group-hover:text-sky-400 transition-colors">{{ post.title }}</span>
        </a>
        {% endfor %}
      </div>
    </div>
    {% endfor %}
  </div>
</section>
