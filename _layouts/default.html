<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Noto Sans JP"', "sans-serif"],
            },
            typography: {
              DEFAULT: {
                css: {
                  color: '#4b5563',
                  a: { color: '#38bdf8' },
                  strong: { color: '#111827' },
                  h1: { color: '#111827' },
                  h2: { color: '#111827' },
                  h3: { color: '#111827' },
                  h4: { color: '#111827' },
                  code: { color: '#1f2937', backgroundColor: '#f3f4f6', padding: '0.125rem 0.25rem', borderRadius: '0.25rem' },
                  'code::before': { content: '""' },
                  'code::after': { content: '""' },
                  pre: { backgroundColor: '#f3f4f6', border: '1px solid rgba(209, 213, 219, 0.5)' },
                  blockquote: { borderLeftColor: '#38bdf8', color: '#6b7280' },
                  hr: { borderColor: '#e5e7eb' },
                  th: { color: '#111827' },
                },
              },
              invert: {
                css: {
                  color: '#d1d5db',
                  a: { color: '#38bdf8' },
                  strong: { color: '#f3f4f6' },
                  h1: { color: '#f3f4f6' },
                  h2: { color: '#f3f4f6' },
                  h3: { color: '#f3f4f6' },
                  h4: { color: '#f3f4f6' },
                  code: { color: '#e5e7eb', backgroundColor: '#1f2937', padding: '0.125rem 0.25rem', borderRadius: '0.25rem' },
                  'code::before': { content: '""' },
                  'code::after': { content: '""' },
                  pre: { backgroundColor: '#1f2937', border: '1px solid rgba(55, 65, 81, 0.5)' },
                  blockquote: { borderLeftColor: '#38bdf8', color: '#9ca3af' },
                  hr: { borderColor: '#374151' },
                  th: { color: '#f3f4f6' },
                },
              },
            },
          },
        },
        plugins: [],
      };
    </script>
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css" crossorigin="anonymous" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js" crossorigin="anonymous"
      onload="renderMathInElement(document.body, {delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]});">
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

  <body class="bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100 font-sans antialiased transition-colors duration-300">
    <!-- Header -->
    <header
      class="fixed top-0 left-0 w-full z-50 bg-white/80 dark:bg-gray-950/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 transition-colors duration-300"
    >
      <nav class="h-16 max-w-screen-lg mx-auto px-6">
        <div class="flex items-center justify-between h-full">
          <a
            href="{{ site.baseurl }}/"
            class="text-lg font-bold text-gray-900 dark:text-gray-100 hover:text-sky-400 transition-colors"
            >MKのページ</a
          >
          <div class="flex items-center space-x-8">
            <ul class="flex items-center space-x-8 text-sm font-medium">
              <li>
                <a
                  href="{{ site.baseurl }}/"
                  class="text-gray-600 dark:text-gray-400 hover:text-sky-400 transition-colors"
                  >ホーム</a
                >
              </li>
              <li>
                <a
                  href="{{ site.baseurl }}/blog/"
                  class="text-gray-600 dark:text-gray-400 hover:text-sky-400 transition-colors"
                  >ブログ</a
                >
              </li>
            </ul>
            <button
              id="theme-toggle"
              type="button"
              class="relative inline-flex items-center w-14 h-7 rounded-full bg-gray-200 dark:bg-gray-700 transition-colors duration-300 focus:outline-none"
              aria-label="テーマ切り替え"
            >
              <!-- 太陽アイコン（左側） -->
              <svg class="absolute left-1.5 w-3.5 h-3.5 text-amber-500" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd" />
              </svg>
              <!-- 月アイコン（右側） -->
              <svg class="absolute right-1.5 w-3.5 h-3.5 text-sky-300" fill="currentColor" viewBox="0 0 20 20">
                <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
              </svg>
              <!-- スライドするノブ -->
              <span
                id="theme-knob"
                class="absolute left-0.5 top-0.5 w-6 h-6 rounded-full bg-white shadow-md transition-transform duration-300"
              ></span>
            </button>
          </div>
        </div>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <!-- Footer -->
    <footer class="py-8 px-6 border-t border-gray-200 dark:border-gray-800 transition-colors duration-300">
      <div class="max-w-screen-lg mx-auto text-center">
        <p class="text-sm text-gray-500">
          &copy; 2026 Masakazu Kizawa. All rights reserved.
        </p>
      </div>
    </footer>

    <script>
      (function() {
        var toggle = document.getElementById('theme-toggle');
        var knob = document.getElementById('theme-knob');

        function updateSwitch() {
          if (document.documentElement.classList.contains('dark')) {
            knob.style.transform = 'translateX(1.75rem)';
          } else {
            knob.style.transform = 'translateX(0)';
          }
        }

        updateSwitch();

        toggle.addEventListener('click', function() {
          document.documentElement.classList.toggle('dark');
          var isDark = document.documentElement.classList.contains('dark');
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
          updateSwitch();
        });
      })();
    </script>
  </body>
</html>
