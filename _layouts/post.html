---
layout: default
---
<article class="pt-32 pb-20 px-6">
  <div class="max-w-screen-md mx-auto">
    <header class="mb-10">
      <time class="text-sm text-sky-400 font-medium" datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%Y年%m月%d日" }}
      </time>
      <h1 class="text-3xl md:text-4xl font-bold text-gray-900 dark:text-gray-100 mt-2">{{ page.title }}</h1>
      {% if page.tags.size > 0 %}
      <div class="flex flex-wrap gap-2 mt-3">
        {% for tag in page.tags %}
        <a href="{{ site.baseurl }}/tags/#{{ tag }}" class="px-2.5 py-0.5 text-xs rounded-full bg-sky-400/10 text-sky-400 border border-sky-400/20 hover:bg-sky-400/20 transition-colors">{{ tag }}</a>
        {% endfor %}
      </div>
      {% endif %}
    </header>
    <div class="prose prose-lg dark:prose-invert max-w-none">
      {{ content }}
    </div>
    <div class="mt-16 pt-8 border-t border-gray-200 dark:border-gray-800">
      <a href="{{ site.baseurl }}/blog/" class="text-sky-400 hover:text-sky-300 transition-colors text-sm">
        &larr; ブログ一覧に戻る
      </a>
    </div>
  </div>
</article>
